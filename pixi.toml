[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.11.*"
ipython = ">=8.37.0,<9"
pydantic-settings = ">=2.12.0,<3"
tectonic = ">=0.15.0,<0.16"
pip = ">=26.0.1,<27"

[pypi-dependencies]
simplemem = { git = "https://github.com/aiming-lab/SimpleMem.git", branch = "pypi-package" }
tinker = ">=0.1"
tinker-cookbook = { git = "https://github.com/thinking-machines-lab/tinker-cookbook" }
lancedb = ">=0.22"
sentence-transformers = ">=3.0"
datasets = ">=2.20"
transformers = ">=4.44,<5.0"
torch = ">=2.8.0"
pylance = ">=0.32,<1"
nltk = ">=3.9,<4"
rouge-score = ">=0.1.2,<0.2"
bert-score = ">=0.3.13,<0.4"
rank-bm25 = ">=0.2.2,<0.3"
sglang = ">=0.5.2, <0.6"
vllm = ">=0.10, <0.12"
pybase64 = ">=1.4.3, <2"
orjson = ">=3.11.7, <4"
uvicorn = ">=0.41.0, <0.42"
fastapi = ">=0.133.0, <0.134"
uvloop = ">=0.22.1, <0.23"
setproctitle = ">=1.3.7, <2"
psutil = ">=7.2.2, <8"
pynvml = ">=13.0.1, <14"
python-multipart = ">=0.0.22, <0.0.23"
msgspec = ">=0.20.0, <0.21"
prometheus-client = ">=0.20.0"
pyzmq = ">=25.1.2"
sentencepiece = ">=0.2.1, <0.3"
tiktoken = ">=0.12.0, <0.13"
pillow = ">=12.1.1, <13"
scipy = ">=1.15.3, <2"
timm = "==1.0.16"
openai = ">=1.75, <2"
huggingface-hub = ">=0.36.2, <0.37"
interegular = ">=0.3.3, <0.4"
partial-json-parser = ">=0.2.1.1.post7, <0.3"
sgl-kernel = ">=0.3.12"
torchaudio = ">=2.8.0"
torchvision = ">=0.23.0"
compressed-tensors = ">=0.13.0, <0.14"
browsergym-webarena = ">=0.14.0"
gymnasium = ">=0.27"
lightmem = { path = "vendor/lightmem", editable = true }
memrl = { path = "vendor/memrl", editable = true }
agentic-memory = { path = "vendor/a-mem", editable = true }
mem0ai = ">=0.1,<1"
hipporag = ">=2.0"
chromadb = ">=0.5"
loguru = ">=0.7"
litellm = ">=1.70,<2"
faiss-cpu = ">=1.8,<2"
posthog = ">=3,<7"

[activation.env]
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"
