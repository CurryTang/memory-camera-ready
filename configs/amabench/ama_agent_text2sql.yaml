# AMA-Agent AMABench TEXT2SQL profile.
# Hypothesis-only profile: reduce distracting spans under the strict judge.
retrieval_mode: "embed"
top_k: 3
retrieval_prefilter_k: 16
chunk_size: 8192
causal: true
causal_graph_max_edges: 4
enable_tools: true
tool_retrieval_scope: "prefiltered"
tool_retrieval_prefilter_k: 16
tool_retrieval_max_results: 3
temperature: 0
max_tokens: 16384
context_guardrail: "Answer only with facts directly supported by the retrieved state memory, retrieved turns, graph nodes, or code output. Do not add unstated details."
